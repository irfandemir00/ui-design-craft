<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <rect x="12" y="12" width="232" height="232" rx="52" fill="#131417"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="51.5" stroke="#F6F4EF" stroke-opacity="0.1"/>
  <!-- Structural precision grid -->
  <line x1="60" y1="76" x2="196" y2="76" stroke="#F6F4EF" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="60" y1="180" x2="196" y2="180" stroke="#F6F4EF" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="76" y1="60" x2="76" y2="196" stroke="#F6F4EF" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="180" y1="60" x2="180" y2="196" stroke="#F6F4EF" stroke-opacity="0.16" stroke-width="2"/>
  <!-- Architectural layout frame -->
  <rect x="64" y="64" width="128" height="128" rx="14" stroke="#F6F4EF" stroke-width="6"/>
  <!-- Asymmetric split divider -->
  <line x1="112" y1="64" x2="112" y2="192" stroke="#F6F4EF" stroke-width="5"/>
  <line x1="112" y1="120" x2="192" y2="120" stroke="#F6F4EF" stroke-width="5"/>
  <!-- Typographic proportion & optical bars -->
  <line x1="130" y1="90" x2="174" y2="90" stroke="#F6F4EF" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="146" x2="168" y2="146" stroke="#F6F4EF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="164" x2="156" y2="164" stroke="#F6F4EF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- Single intentional vermilion focal accent -->
  <rect x="76" y="78" width="22" height="22" rx="5" fill="#D94E34"/>
  <!-- Precision drafting corner ticks -->
  <circle cx="64" cy="64" r="5" fill="#131417" stroke="#F6F4EF" stroke-width="3"/>
  <circle cx="192" cy="192" r="5" fill="#D94E34"/>
</svg>
